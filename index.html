<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>TheIOGames – Free Online Games Arcade</title>
<meta name="description" content="TheIOGames: 50+ original free browser games – physics, arcade, puzzle, sports, simulators, IO arenas and local 2-player games. No downloads, no accounts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='900' text-anchor='middle' fill='white'%3EIO%3C/text%3E%3C/svg%3E">
<style>
/* =====================================================================
   THEME
   ===================================================================== */
:root{
  --bg:#0b0e1c; --bg2:#141833; --card:#1a1f43; --card2:#232a5c; --text:#eef1ff; --muted:#9aa3c7;
  --accent:#7c5cff; --accent2:#22d3ee; --hot:#ff5e8a; --gold:#ffcf4a; --good:#34d399; --bad:#fb7185; --radius:18px;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
body.th-ocean{--accent:#0ea5e9;--accent2:#34d399;--bg:#06121c;--card:#0f2433;--card2:#15354a}
body.th-sunset{--accent:#ff6a3d;--accent2:#ffcf4a;--bg:#170b14;--card:#2a1426;--card2:#3c1b33}
body.th-forest{--accent:#22c55e;--accent2:#a3e635;--bg:#08130c;--card:#11261a;--card2:#183524}
body.th-candy{--accent:#ec4899;--accent2:#a78bfa;--bg:#140a1a;--card:#2a1335;--card2:#3a1a49}
body.th-gold{--accent:#eab308;--accent2:#fde047;--bg:#0f0d06;--card:#241f0e;--card2:#352d12}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 15% -5%,color-mix(in srgb,var(--accent) 35%,transparent),transparent 60%),radial-gradient(800px 500px at 95% 10%,color-mix(in srgb,var(--accent2) 22%,transparent),transparent 60%),var(--bg)}
body.playing{overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent2)}

/* ---------- header ---------- */
.tagline{text-align:center;padding:10px 12px 6px;font-weight:900;font-size:clamp(1rem,3.6vw,1.45rem);letter-spacing:.3px;background:linear-gradient(90deg,#ff5e8a,#ffcf4a,#34d399,#22d3ee,#a78bfa,#ff5e8a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 8s linear infinite;filter:drop-shadow(0 2px 10px rgba(255,94,138,.25))}
@keyframes rainbow{to{background-position:300% 0}}
.top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.07)}
.logo{font-weight:900;font-size:1.6rem;letter-spacing:.2px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-style:normal;font-size:.95rem;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 50%,transparent)}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);font-size:16px;outline:none;transition:.2s}
.search input:focus{border-color:var(--accent2);background:rgba(255,255,255,.11)}
.search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.95rem;opacity:.7}
.tbtns{display:flex;gap:8px;align-items:center}
.icon-btn{background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px;font-size:1rem;transition:.15s;white-space:nowrap;font-weight:700}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.coins{background:linear-gradient(135deg,rgba(255,207,74,.22),rgba(255,140,40,.15));border:1px solid rgba(255,207,74,.35);color:#ffe7a3}

/* ---------- layout ---------- */
main{max-width:1320px;margin:auto;padding:0 max(16px,env(safe-area-inset-left)) 30px}
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:18px}
.feat{position:relative;border-radius:24px;overflow:hidden;min-height:280px;background:linear-gradient(135deg,var(--c1),var(--c2));cursor:pointer;box-shadow:0 20px 50px rgba(0,0,0,.45);transition:transform .25s}
.feat:hover{transform:translateY(-3px)}
.feat .fe{position:absolute;right:6%;top:50%;transform:translateY(-50%);font-size:clamp(90px,15vw,170px);filter:drop-shadow(0 18px 24px rgba(0,0,0,.45));animation:float 3.4s ease-in-out infinite}
.feat .ft{position:absolute;left:28px;bottom:26px;right:40%;z-index:2}
.feat .ft small{display:inline-block;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px;font-weight:800;font-size:.75rem;letter-spacing:1px}
.feat h2{font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:900;margin:8px 0 6px;text-shadow:0 4px 18px rgba(0,0,0,.4)}
.feat p{opacity:.92;font-size:.98rem;line-height:1.4;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.feat .go{margin-top:14px;display:inline-block;padding:12px 22px;border-radius:14px;background:#fff;color:#111;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.feat::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 30%,rgba(255,255,255,.35),transparent 50%),linear-gradient(90deg,rgba(0,0,0,.45),transparent 65%)}
.feat .dots{position:absolute;right:16px;bottom:14px;display:flex;gap:6px;z-index:3}
.feat .dots b{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4)}
.feat .dots b.on{background:#fff;width:22px;border-radius:6px}
.side{display:flex;flex-direction:column;gap:12px}
.box{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px}
.box h3{font-size:1rem;font-weight:900;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h3 small{color:var(--muted);font-weight:700;font-size:.78rem}
.petbar{height:12px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.petbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5e8a,#ffcf4a,#34d399);border-radius:8px;transition:width .4s}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.statrow div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 4px}
.statrow b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.statrow span{font-size:.72rem;color:var(--muted);font-weight:700}
.chal{display:flex;flex-direction:column;gap:8px}
.chal .c{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;font-size:.86rem}
.chal .c i{font-style:normal;font-size:1.2rem}
.chal .c div{flex:1}
.chal .c .pb{height:6px;background:rgba(255,255,255,.1);border-radius:4px;margin-top:4px;overflow:hidden}
.chal .c .pb u{display:block;height:100%;background:var(--good)}
.chal .c.done{opacity:.65}
.chal .c em{font-style:normal;font-weight:800;color:var(--gold);font-size:.8rem;white-space:nowrap}

.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-weight:800;font-size:.9rem;transition:.15s;white-space:nowrap}
.cat:hover{background:rgba(255,255,255,.14)}
.cat.on{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.sec{margin-top:22px}
.sec>h2{font-size:1.3rem;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec>h2 small{font-size:.8rem;color:var(--muted);font-weight:700}
.sec>h2 .more{margin-left:auto;font-size:.85rem;color:var(--accent2);font-weight:800;cursor:pointer}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,230px);gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.row .card{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.empty{color:var(--muted);padding:14px;background:rgba(255,255,255,.04);border-radius:14px;font-size:.9rem}
.card{border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid rgba(255,255,255,.08);transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer;display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 38px rgba(0,0,0,.5);border-color:color-mix(in srgb,var(--accent2) 60%,transparent)}
.art{height:128px;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font-size:64px;position:relative;overflow:hidden}
.art::before{content:"";position:absolute;width:140%;height:60%;left:-20%;bottom:-38%;border-radius:50%;background:rgba(0,0,0,.18)}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 18%,rgba(255,255,255,.32),transparent 50%),repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px)}
.art .e{filter:drop-shadow(0 10px 12px rgba(0,0,0,.45));z-index:1;transition:transform .3s}
.card:hover .art .e{transform:scale(1.15) rotate(-6deg)}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:5px;z-index:2}
.badge{font-size:.66rem;font-weight:900;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.55);letter-spacing:.4px}
.badge.p2{background:linear-gradient(90deg,#ff5e8a,#ff9a3d)}
.badge.new{background:linear-gradient(90deg,#22c55e,#14b8a6)}
.badge.hot{background:linear-gradient(90deg,#f43f5e,#f97316)}
.fav{position:absolute;right:8px;top:6px;z-index:3;font-size:1.25rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));opacity:.85;padding:2px 4px}
.fav:hover{transform:scale(1.2)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info p{color:var(--muted);font-size:.78rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;gap:6px;font-size:.72rem;color:var(--muted);margin-top:auto;padding-top:4px}
.meta b{color:var(--accent2)}
@keyframes float{0%,100%{transform:translateY(-50%) rotate(-3deg)}50%{transform:translateY(calc(-50% - 10px)) rotate(3deg)}}

/* pets */
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.pet{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 6px;text-align:center;font-size:.75rem;position:relative}
.pet canvas{width:76px;height:76px;display:block;margin:auto}
.pet b{display:block;font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet.locked canvas{filter:brightness(0) opacity(.35)}
.pet.locked b{color:var(--muted)}
.r-Common{color:#cbd5e1}.r-Uncommon{color:#4ade80}.r-Rare{color:#60a5fa}.r-Epic{color:#c084fc}.r-Legendary{color:#fbbf24}.r-Mythic{color:#f472b6}
.pet.got.rk-Legendary,.pet.got.rk-Mythic{box-shadow:0 0 18px color-mix(in srgb,#fbbf24 40%,transparent);border-color:rgba(251,191,36,.5)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.05);border-radius:14px;padding:10px;border:1px solid rgba(255,255,255,.07)}
.ach i{font-style:normal;font-size:1.6rem;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.08);flex:none}
.ach.got i{background:linear-gradient(135deg,var(--gold),#ff8a3d)}
.ach:not(.got){opacity:.55}
.ach b{font-size:.9rem}.ach small{display:block;color:var(--muted);font-size:.76rem}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sitem{background:rgba(255,255,255,.05);border-radius:14px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.08)}
.sitem .sw{height:42px;border-radius:10px;margin-bottom:8px}
.sitem button{margin-top:8px;width:100%;padding:8px;border-radius:10px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.sitem button:disabled{background:rgba(255,255,255,.1);color:var(--muted)}
.note{margin-top:26px;font-size:.84rem;color:var(--muted);background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15);border-radius:14px;padding:12px 14px;line-height:1.45}
.statsTable{width:100%;border-collapse:collapse;font-size:.85rem}
.statsTable td,.statsTable th{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
.statsTable th{color:var(--muted);font-size:.75rem}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:10px 16px 34px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- game screen ---------- */
#game{position:fixed;inset:0;background:#05060d;z-index:50;display:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game.on{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#layer{position:absolute;inset:0;z-index:4;pointer-events:none}
#layer>*{pointer-events:auto}
#bar{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;z-index:16;flex-wrap:wrap;max-width:calc(100vw - 20px)}
#bar button,#petChip{background:rgba(10,12,30,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 11px;font-weight:800;font-size:.9rem;min-height:38px;color:#fff}
#bar button:hover{background:rgba(40,46,100,.85)}
#petChip{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;pointer-events:none}
#petChip u{display:block;width:44px;height:6px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;text-decoration:none}
#petChip u i{display:block;height:100%;background:linear-gradient(90deg,#ff5e8a,#ffcf4a)}
#hudL{position:absolute;left:max(8px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 48px);display:flex;flex-direction:column;gap:5px;z-index:5;pointer-events:none}
.chip{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:120px;background:rgba(10,12,30,.62);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:5px 11px;font-size:.85rem;backdrop-filter:blur(4px);color:#fff}
.chip span{color:#b9c1ea}.chip b{font-size:1rem;font-variant-numeric:tabular-nums}
#hudR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:190px;z-index:5;pointer-events:none;background:rgba(10,12,30,.6);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;font-size:.82rem;color:#fff}
#hudR:empty{display:none}
.bt{font-weight:800;text-align:center;margin-bottom:4px;color:var(--accent2);letter-spacing:.5px;font-size:.8rem}
.br{display:flex;gap:6px;padding:2px 0;align-items:center}
.br i{font-style:normal;width:18px;color:#8e97c4;text-align:right}
.br span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br b{font-variant-numeric:tabular-nums}
.br.me{color:#ffe36e;font-weight:800}
#hint{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;width:max-content;text-align:center;background:rgba(10,12,30,.78);border:1px solid rgba(255,255,255,.18);padding:9px 16px;border-radius:14px;font-size:.88rem;z-index:15;pointer-events:none;transition:opacity .6s;color:#fff}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:120;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:linear-gradient(90deg,rgba(124,92,255,.95),rgba(34,211,238,.95));padding:10px 18px;border-radius:14px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:toastIn 2.6s ease forwards;white-space:nowrap;color:#fff}
@keyframes toastIn{0%{opacity:0;transform:translateY(-14px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#joy{position:fixed;width:116px;height:116px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none;pointer-events:none;z-index:7}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 4px 14px rgba(0,0,0,.4)}
#boostBtn{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd86b,#ff8a3d);font-weight:900;font-size:.85rem;color:#3a1500;box-shadow:0 8px 22px rgba(0,0,0,.5);z-index:6;border:3px solid rgba(255,255,255,.6);touch-action:none;user-select:none}
#boostBtn.on{transform:scale(.92);filter:brightness(1.15)}
#pads{position:absolute;inset:0;pointer-events:none;z-index:8}
.pad{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:900;display:grid;place-items:center;font-size:1.3rem;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);user-select:none;-webkit-user-select:none;box-shadow:0 6px 16px rgba(0,0,0,.35);line-height:1.05;text-align:center}
.pad.on{background:rgba(255,255,255,.38);transform:scale(.93)}
.pad.p1{border-color:rgba(96,165,250,.9);background:rgba(59,130,246,.22)}
.pad.p2{border-color:rgba(251,113,133,.9);background:rgba(244,63,94,.22)}
.pad.sq{border-radius:18px}
.overlay{position:absolute;inset:0;background:rgba(3,4,14,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.ocard{background:linear-gradient(160deg,#222859,#141833);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:24px 26px;width:min(440px,100%);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .3s ease;max-height:94vh;overflow:auto;color:#fff}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.otitle{font-size:1.7rem;font-weight:900}
.oscore{font-size:3rem;font-weight:900;margin-top:6px;background:linear-gradient(90deg,#ffe36e,#ff9a5c);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.olabel{color:var(--muted);font-size:.8rem;letter-spacing:2px}
.obest{margin-top:8px;font-weight:700;color:var(--accent2)}
.obest.new{color:#ffe36e;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.olines{margin-top:8px;color:#c7cdf0;font-size:.95rem;line-height:1.5}
.obtns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btn{padding:13px;border-radius:14px;font-weight:800;font-size:1.05rem;background:rgba(255,255,255,.12);transition:.15s;color:#fff}
.btn:hover{background:rgba(255,255,255,.22)}

<script>
/* =====================================================================

   HOW TO ADD A NEW GAME

      E.best(), E.gameOver({score,title,lines,win}), E.panel, E.choose(), E.pads(),
      E.toast(), E.data()/E.save(), E.ach(), E.layer (DOM layer)

   1P/2P mode select, stats, coins and the 3-minute pet reward are handled for you.
   ===================================================================== */
(() => {
'use strict';

/* ------------------------------ utils ------------------------------ */
const TAU = Math.PI * 2;

/* particles + floating text */

    clear() { P.length = 0; T.length = 0; },

}
/* in-canvas buttons */
function UI() {
  const R = [];

    clear() { R.length = 0; },
    btn(ctx, id, x, y, w, h, text, o) {

/* ------------------------------ sound ------------------------------ */
const Sound = (() => {

    thud: () => { noise(0.12, 0.16, 300); tone(80, 0.12, 'sine', 0.15, -30); },

      nextX += lerp(270, 230, lvl);
    }
    function die() { if (dead) return; dead = true; E.sound('crash'); E.shake(10); fx.burst(bird.x, bird.y, 30, { col: ['#fde047', '#fb923c', '#fff'], spd: 260, shape: 's' });
      const medal = score >= 40 ? '💎 Diamond' : score >= 25 ? '🥇 Gold' : score >= 10 ? '🥈 Silver' : score >= 5 ? '🥉 Bronze' : 'None yet';
      E.gameOver({ score, title: 'Bonk!', lines: ['Medal: ' + medal], delay: 900 }); }
    function drawBird(x, y, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ellipse(ctx, 0, 0, 22, 19, lgrad(ctx, 0, -19, 0, 19, ['#fff59d', '#fbbf24']));
      ctx.strokeStyle = '#b45309'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(0, 0, 22, 19, 0, 0, TAU); ctx.stroke();
      ellipse(ctx, 4, 6, 12, 8, '#fffbeb');
      // wing
      const wf = Math.sin(bird.flap * 30) * 8;
      ctx.beginPath(); ctx.ellipse(-8, 2 + wf * 0.4, 11, 7 - Math.abs(wf) * 0.3, -0.4 + wf * 0.05, 0, TAU); ctx.fillStyle = '#f59e0b'; ctx.fill(); ctx.stroke();
      circle(ctx, 9, -7, 7, '#fff'); ctx.stroke(); circle(ctx, 11, -7, 3.4, '#1f2937'); circle(ctx, 12, -8.5, 1.2, '#fff');
      ctx.beginPath(); ctx.moveTo(17, -1); ctx.quadraticCurveTo(30, 2, 18, 7); ctx.closePath(); ctx.fillStyle = '#f97316'; ctx.fill(); ctx.stroke();
      ellipse(ctx, 4, 5, 4, 2.5, 'rgba(244,114,182,.6)');
      ctx.beginPath(); ctx.moveTo(-2, -18); ctx.quadraticCurveTo(2, -28, 6, -18); ctx.fillStyle = '#f59e0b'; ctx.fill();
      ctx.restore();
    }
    return {
      update(dt) {
        t += dt; fx.update(dt); bird.flap = Math.max(0, bird.flap - dt);
        if (!started) { bird.y = E.H * 0.42 + Math.sin(t * 4) * 10; groundOff += 150 * dt; return; }
        if (dead) { if (bird.y < gy() - 18) { bird.vy += G * dt; bird.y += bird.vy * dt; bird.rot = Math.min(1.5, bird.rot + dt * 6); } return; }
        const sp = 170 + Math.min(70, score * 2);
        bird.vy += G * dt; bird.y += bird.vy * dt; bird.rot = clamp(bird.vy / 700, -0.5, 1.3);
        dist2 += sp * dt; groundOff += sp * dt; nextX -= sp * dt;
        while (nextX < E.W + 300) addPipe();
        for (const p of pipes) {
          p.x -= sp * dt; if (p.move) p.top = p.base + Math.sin(t * 1.6 + p.ph) * p.move;
          if (!p.passed && p.x + 40 < bird.x) { p.passed = true; score++; E.sound('score'); fx.burst(bird.x, bird.y, 8, { col: '#fff', shape: 'star', spd: 120 }); }
          if (bird.x + 16 > p.x - 38 && bird.x - 16 < p.x + 38 && (bird.y - 15 < p.top || bird.y + 15 > p.top + p.gap)) die();
        }
        pipes = pipes.filter(p => p.x > -100);
        if (bird.y > gy() - 18) { bird.y = gy() - 18; die(); }
        if (bird.y < -40) bird.y = -40;
      },
      draw() {
        const W = E.W, Hh = E.H, night = clamp((Math.sin(score / 12 * Math.PI - Math.PI / 2) + 1) / 2, 0, 1);
        const sky1 = night > 0.5 ? '#0b1d4d' : '#5ec8ff', sky2 = night > 0.5 ? '#3b2a6b' : '#c8f1ff';
        ctx.fillStyle = lgrad(ctx, 0, 0, 0, Hh, [sky1, sky2]); ctx.fillRect(0, 0, W, Hh);
        if (night > 0.5) { for (let i = 0; i < 50; i++) { ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(t * 3 + i)})`; ctx.fillRect((i * 137) % W, (i * 71) % (Hh * 0.6), 2, 2); } circle(ctx, W * 0.8, 90, 34, '#f8fafc'); circle(ctx, W * 0.8 + 12, 82, 30, sky1); }
        else { ctx.drawImage(E.glow(50), W * 0.8 - 90, 0, 180, 180); circle(ctx, W * 0.8, 90, 40, '#fff7c2'); }
        // far mountains
        for (let layer = 0; layer < 2; layer++) {
          const par = layer ? 0.35 : 0.15, base = gy() - (layer ? 40 : 110), col = night > 0.5 ? (layer ? '#26315c' : '#1c2448') : (layer ? '#7cc8a4' : '#a8dcd1');
          ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, gy());
          for (let x = 0; x <= W + 40; x += 40) { const wx = x + groundOff * par; ctx.lineTo(x, base - Math.abs(Math.sin(wx * 0.006 + layer)) * (layer ? 60 : 110) - Math.sin(wx * 0.021) * 12); }
          ctx.lineTo(W, gy()); ctx.fill();
        }
        // clouds
        for (let i = 0; i < 6; i++) { const cx = ((i * 260 - groundOff * 0.25) % (W + 260) + W + 260) % (W + 260) - 130, cy = 60 + (i % 3) * 50; ctx.fillStyle = night > 0.5 ? 'rgba(200,200,255,.15)' : 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(cx, cy, 22, 0, TAU); ctx.arc(cx + 26, cy - 10, 28, 0, TAU); ctx.arc(cx + 56, cy, 20, 0, TAU); ctx.fill(); }
        // crystal pillars
        for (const p of pipes) {
          const x = p.x - 38, w = 76;
          for (const [y0, y1, top] of [[-20, p.top, true], [p.top + p.gap, gy(), false]]) {
            const g = lgrad(ctx, x, 0, x + w, 0, ['#7c3aed', '#c084fc', '#e9d5ff', '#a855f7', '#6d28d9']);
            ctx.fillStyle = g; ctx.fillRect(x, y0, w, y1 - y0);
            ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + 12, y0, 8, y1 - y0);
            const capY = top ? y1 - 28 : y0; rr(ctx, x - 8, capY, w + 16, 28, 8); ctx.fillStyle = lgrad(ctx, x, 0, x + w, 0, ['#5b21b6', '#ddd6fe', '#7c3aed']); ctx.fill();
            ctx.strokeStyle = 'rgba(46,16,101,.6)'; ctx.lineWidth = 2; ctx.stroke();
            // crystal tips
            ctx.fillStyle = '#f5d0fe'; for (let k = 0; k < 3; k++) { const tx = x + 10 + k * 26; ctx.beginPath(); if (top) { ctx.moveTo(tx, capY + 28); ctx.lineTo(tx + 9, capY + 40); ctx.lineTo(tx + 18, capY + 28); } else { ctx.moveTo(tx, capY); ctx.lineTo(tx + 9, capY - 12); ctx.lineTo(tx + 18, capY); } ctx.fill(); }
          }
        }
        // ground
        ctx.fillStyle = '#6ab04c'; ctx.fillRect(0, gy(), W, 18); ctx.fillStyle = lgrad(ctx, 0, gy() + 18, 0, Hh, ['#d4a373', '#a47148']); ctx.fillRect(0, gy() + 18, W, Hh);
        ctx.fillStyle = '#4e8a36'; for (let x = -(groundOff % 30); x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x, gy() + 18); ctx.lineTo(x + 15, gy()); ctx.lineTo(x + 30, gy() + 18); ctx.fill(); }
        drawBird(bird.x, bird.y, bird.rot);
        fx.draw(ctx);
        label(ctx, String(score), W / 2, 70, 60);
        if (!started) { label(ctx, 'Flappy Challenge', W / 2, Hh * 0.22, 40, '#fff59d'); label(ctx, E.touch ? 'TAP TO FLAP' : 'CLICK / SPACE TO FLAP', W / 2, Hh * 0.62, 24); }
      },
      down() { if (dead) return; if (!started) started = true; bird.vy = FLAP; bird.flap = 0.25; E.sound('jump', 30); fx.burst(bird.x - 14, bird.y + 6, 4, { col: '#fff', spd: 60, size: 3 }); },
      onKey(c) { if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') this.down(); },
      resize() { if (!started) reset(); else bird.x = E.W * 0.3; },
      hud() { return { stats: [['Best', fmt(E.best())]] }; }
    };
  }
});

/* =====================================================================
   BOOT – metadata for the original 5 games, then render
   ===================================================================== */
const LEGACY_META = {
  hole: { cats: ['IO Arena', 'Arcade', 'Creative'], input: 'joy', pop: true, legacy: true },
  farm: { cats: ['Simulation', 'IO Arena'], input: 'joy', legacy: true },
  chicken: { cats: ['IO Arena', 'Arcade'], input: 'joy', legacy: true },
  snake: { cats: ['IO Arena', 'Arcade'], input: 'joy', pop: true, legacy: true },
  cells: { cats: ['IO Arena', 'Arcade'], input: 'joy', legacy: true }
};
GAMES.forEach(g => { if (LEGACY_META[g.id]) Object.assign(g, LEGACY_META[g.id]); if (!g.input) g.input = 'ptr'; if (!g.cats) g.cats = []; });
const ORDER = window.__ORDER || [];
GAMES.sort((a, b) => { const ia = ORDER.indexOf(a.id), ib = ORDER.indexOf(b.id); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
window.TheIOGames = { registerGame, engine: E, games: GAMES };
renderMenu();
route();
})();
</script>
